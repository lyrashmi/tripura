<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monier-Williams · Sanskrit-English Dictionary</title>

<!-- EB Garamond (Latin) via Fontsource CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-ext-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-ext-500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-ext-600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-ext-700.css">
<!-- Devanagari fallback via Fontsource CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-devanagari@5.2.7/index.css">

<style>
/* Shobhika (Devanagari) — open-source SIL OFL font, served via CDN */
@font-face {
    font-family: 'Shobhika';
    src: url('https://huggingface.co/loopdesk-ai/lipika/resolve/main/fonts/shobhika-400.woff2') format('woff2'),
         url('https://ir.tawkit.net/1app/font/IN-Shobhika.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: 'Shobhika';
    src: url('https://huggingface.co/loopdesk-ai/lipika/resolve/main/fonts/shobhika-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
}
/* Unicode-ranged aliases: Devanagari glyphs render in Shobhika, everything else falls through to EB Garamond */
@font-face {
    font-family: 'Shobhika Devanagari';
    src: url('https://huggingface.co/loopdesk-ai/lipika/resolve/main/fonts/shobhika-400.woff2') format('woff2'),
         url('https://ir.tawkit.net/1app/font/IN-Shobhika.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0900-097F;
}
@font-face {
    font-family: 'Shobhika Devanagari';
    src: url('https://huggingface.co/loopdesk-ai/lipika/resolve/main/fonts/shobhika-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
    unicode-range: U+0900-097F;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --cream-bg: #fbf7ee;
    --cream-deep: #f6efdf;
    --card-bg: #fffdf8;
    --input-bg: #fffefb;
    --output-bg: #fdf9ef;
    --gold-100: #f7ecd2;
    --gold-200: #efdfb4;
    --gold-300: #e3c987;
    --gold-400: #d4af37;
    --gold-500: #c9971f;
    --gold-600: #a87d15;
    --gold-700: #8a6512;
    --gold-800: #6b4e0e;
    --ink: #3b3020;
    --ink-soft: #6d5f45;
    --ink-muted: #9c8d6f;
    --line: rgba(168, 125, 21, 0.22);
    --line-soft: rgba(168, 125, 21, 0.12);
    --line-strong: rgba(168, 125, 21, 0.42);
    --font-latin: 'EB Garamond', 'Georgia', serif;
    --font-dev: 'Shobhika', 'Noto Sans Devanagari', serif;
    --font-text: 'Shobhika Devanagari', 'EB Garamond', 'Georgia', serif;
    --shadow-card: 0 1px 2px rgba(140, 100, 30, 0.05), 0 12px 40px rgba(140, 100, 30, 0.09);
    --shadow-soft: 0 2px 10px rgba(140, 100, 30, 0.08);

    --body-size: 1.0625rem;
    --body-line: 1.9;
}

html { scroll-behavior: smooth; }

body {
    font-family: var(--font-text);
    background:
        radial-gradient(1100px 520px at 50% -140px, rgba(212, 175, 55, 0.14), transparent 65%),
        radial-gradient(900px 480px at 50% 115%, rgba(201, 151, 31, 0.10), transparent 70%),
        linear-gradient(180deg, #fdfbf5 0%, var(--cream-bg) 45%, var(--cream-deep) 100%);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}

::selection { background: rgba(212, 175, 55, 0.28); color: var(--gold-800); }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(168, 125, 21, 0.25); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(168, 125, 21, 0.45); }

.container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 16px 24px 64px;
}

/* ---------- Brand (Top Menu) ---------- */
.brand-wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 34px 24px 0;
    animation: rise .55s ease both;
}
.brand {
    display: inline-flex;
    align-items: baseline;
    font-family: var(--font-latin);
    font-size: 1.42rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-decoration: none;
    background: linear-gradient(120deg, var(--gold-700) 0%, var(--gold-500) 45%, var(--gold-400) 60%, var(--gold-700) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    transition: filter .3s ease;
}
.brand .io { font-weight: 400; }
.brand:hover { filter: brightness(1.12); }

/* ---------- Header ---------- */
header { text-align: center; margin-bottom: 44px; animation: rise .6s ease both; }

h1 {
    font-family: var(--font-latin);
    font-size: clamp(2rem, 4.5vw, 2.9rem);
    font-weight: 600;
    letter-spacing: 0.01em;
    background: linear-gradient(120deg, var(--gold-700) 0%, var(--gold-500) 45%, var(--gold-400) 60%, var(--gold-700) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 14px;
}

.ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 14px;
}
.ornament .rule {
    width: 72px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-400));
}
.ornament .rule:last-child {
    background: linear-gradient(90deg, var(--gold-400), transparent);
}
.ornament .gem {
    width: 7px;
    height: 7px;
    transform: rotate(45deg);
    background: linear-gradient(135deg, var(--gold-400), var(--gold-600));
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
}

.subtitle {
    font-family: var(--font-latin);
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-muted);
}

/* ---------- Panels ---------- */
.panel {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow-card);
    position: relative;
}
.panel::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
}

.main-panel { padding: 34px 34px 26px; margin-bottom: 26px; animation: rise .6s ease .05s both; }
.results-panel { padding: 14px 34px 22px; animation: rise .6s ease .09s both; }

/* ---------- Search ---------- */
.editor-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

.editor-title {
    font-family: var(--font-latin);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
}

.icon-btn {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    transition: all .25s ease;
    flex: none;
}
.icon-btn:hover {
    color: var(--gold-600);
    background: var(--gold-100);
    border-color: var(--line-soft);
}
.icon-btn svg { width: 16px; height: 16px; }

input#searchInput {
    width: 100%;
    padding: 17px 24px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--input-bg);
    color: var(--ink);
    outline: none;
    font-family: var(--font-text);
    font-size: 1.3rem;
    letter-spacing: 0.015em;
    transition: border-color .3s ease, box-shadow .3s ease;
}
input#searchInput:focus {
    border-color: var(--line-strong);
    box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.14), var(--shadow-soft);
}
input#searchInput::placeholder { color: var(--ink-muted); opacity: .75; font-style: italic; }

/* ---------- Bottom bar ---------- */
.bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line-soft);
}
.char-count {
    font-family: var(--font-latin);
    font-size: 0.92rem;
    color: var(--ink-muted);
    letter-spacing: 0.04em;
}

.clear-btn {
    font-family: var(--font-latin);
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 9px 24px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .25s ease;
}
.clear-btn:hover {
    background: var(--gold-100);
    border-color: var(--line-strong);
    color: var(--gold-700);
}

/* ---------- States ---------- */
.state { text-align: center; padding: 52px 20px 56px; }
.state .gem-big {
    width: 10px; height: 10px;
    transform: rotate(45deg);
    margin: 0 auto 22px;
    background: linear-gradient(135deg, var(--gold-400), var(--gold-600));
    box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.15);
}
.state.loading .gem-big { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse {
    0%, 100% { opacity: .45; transform: rotate(45deg) scale(.85); }
    50%      { opacity: 1;   transform: rotate(45deg) scale(1.2); }
}
.state h2 {
    font-family: var(--font-latin);
    font-size: 1.2rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 10px;
}
.state p {
    font-family: var(--font-latin);
    font-size: 1rem;
    font-style: italic;
    color: var(--ink-muted);
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.7;
}
.state.error h2 { color: #a33a2a; }
.state code {
    font-style: normal;
    background: var(--output-bg);
    border: 1px solid var(--line-soft);
    border-radius: 6px;
    padding: 1px 7px;
    font-size: 0.92em;
}

.chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 26px;
}
.chip {
    font-family: var(--font-text);
    font-size: 1.08rem;
    padding: 8px 20px;
    border-radius: 999px;
    border: 1px solid var(--line-soft);
    background: var(--output-bg);
    color: var(--gold-700);
    cursor: pointer;
    transition: all .25s ease;
}
.chip:hover {
    background: var(--gold-100);
    border-color: var(--line);
    transform: translateY(-2px);
    box-shadow: var(--shadow-soft);
}

/* ---------- Entries ---------- */
.section-label {
    font-family: var(--font-latin);
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 26px 0 4px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line-soft);
}
.section-label:first-child { margin-top: 12px; }

/* Main entries */
.entry {
    padding: 22px 6px 24px;
    border-bottom: 1px solid var(--line-soft);
    animation: rise .4s ease both;
}
.entry:last-child { border-bottom: none; }

/* Sub-senses: detected structurally (same headword as the preceding
   entry, no homonym number of their own) — they nest under their
   main entry with a quiet rule, a warmer wash and a smaller head. */
.entry.cont {
    padding: 13px 6px 15px 28px;
    border-left: 2px solid var(--line-soft);
    border-bottom-color: rgba(168, 125, 21, 0.06);
    border-radius: 0 12px 12px 0;
    background: linear-gradient(90deg, rgba(212, 175, 55, 0.05), rgba(212, 175, 55, 0) 55%);
}

.entry-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
}
.entry-head .spacer { flex: 1; }

.hw {
    font-family: var(--font-text);
    font-size: 1.48rem;
    font-weight: 600;
    color: var(--gold-700);
    line-height: 1.45;
    letter-spacing: 0;
}
/* Devanagari Headword */
.hw-dev {
    font-family: var(--font-dev);
    font-size: 1.3rem; /* Slightly smaller than the 1.48rem IAST */
    font-weight: 400;
    color: var(--ink-soft); /* A softer, muted brown to not compete with the gold IAST */
    margin-left: 18px;
    padding-left: 18px;
    border-left: 1px solid var(--line-soft);
    line-height: 1.45;
    display: inline-block;
    vertical-align: baseline;
}
.entry.cont .hw {
    font-size: 1.16rem;
    font-weight: 500;
    color: var(--gold-600);
}
/* Adjust size for continuation senses */
.entry.cont .hw-dev {
    font-size: 1.05rem;
    margin-left: 14px;
    padding-left: 14px;
}
.entry.cont .entry-head { margin-bottom: 4px; }

.pc-tag {
    font-family: var(--font-latin);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-muted);
    border: 1px solid var(--line-soft);
    background: var(--output-bg);
    padding: 3px 11px;
    border-radius: 999px;
    white-space: nowrap;
}

/* ---------- Definition text ----------
   A single base voice for every element; the overrides below are
   deliberately quiet — same size throughout, only weight, posture
   and tone shift, in the manner of a printed lexicon.            */
.entry-body,
.entry-body * {
    font-family: var(--font-text);
    font-size: var(--body-size);
    font-weight: 400;
    font-style: normal;
    font-variant: normal;
    text-transform: none;
    letter-spacing: normal;
    line-height: var(--body-line);
    color: var(--ink);
    vertical-align: baseline;
}
.entry-body { text-align: left; hyphens: none; }

/* Sanskrit — a touch of bronze, a touch of weight */
.entry-body .s,
.entry-body .s1 { font-weight: 500; color: var(--gold-800); }

/* Grammatical labels (m., f., n., mfn., ind.) — soft italic */
.entry-body .lex { font-style: italic; color: var(--ink-soft); }

/* Editorial abbreviations (q.v., cf., N., fr., cl.) — small capitals */
.entry-body .ab {
    font-variant: small-caps;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
}

/* Cited literature (RV., MBh., L.) — quiet italic */
.entry-body .ls { font-style: italic; color: var(--ink-muted); }

/* Comparative philology */
.entry-body .lang { font-variant: small-caps; letter-spacing: 0.05em; color: var(--ink-muted); }
.entry-body .etym { font-style: italic; color: var(--ink-soft); }
.entry-body .gk   { font-style: italic; color: var(--ink-soft); }

/* Page / column cross-references */
.entry-body .pcol { color: var(--ink-muted); }

/* Homonym numerals — the single size exception, as in print */
.entry-body .hom {
    font-size: 0.72em;
    font-weight: 600;
    line-height: 0;
    vertical-align: 0.55em;
    color: var(--gold-600);
    margin-right: 2px;
}

/* MW sense divider for continuation meanings */
.entry-body .sense-mark {
    color: var(--gold-400);
    font-weight: 500;
    margin-right: 8px;
}

/* search-term highlight — background only */
.entry-body mark {
    background: rgba(212, 175, 55, 0.30);
    border-radius: 3px;
    padding: 0 2px;
}

/* metadata carriers never render */
.entry-body .info,
.entry-body .srs { display: none; }

.load-more-wrap { text-align: center; padding: 24px 0 10px; }

/* ---------- Toast ---------- */
.toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(90px);
    padding: 12px 28px;
    border-radius: 999px;
    background: var(--card-bg);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-card);
    color: var(--gold-700);
    font-family: var(--font-latin);
    font-size: 0.98rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    opacity: 0;
    transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s ease;
    z-index: 100;
    pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ---------- Animation ---------- */
@keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ---------- Responsive ---------- */
@media (max-width: 820px) {
    .brand-wrap { padding: 26px 16px 0; }
    .container { padding: 16px 16px 48px; }
    .main-panel, .results-panel { padding-left: 18px; padding-right: 18px; }
    .main-panel { padding-top: 22px; padding-bottom: 22px; }
    .hw { font-size: 1.32rem; }
    .entry.cont .hw { font-size: 1.1rem; }
    .entry { padding: 20px 2px 22px; }
    .entry.cont { padding: 12px 2px 14px 18px; }
    .entry-body, .entry-body * { font-size: 1rem; line-height: 1.85; }
    input#searchInput { font-size: 1.15rem; padding: 15px 18px; }
    .hw-dev {
        font-size: 1.15rem;
        margin-left: 12px;
        padding-left: 12px;
    }
    .entry.cont .hw-dev {
        font-size: 0.95rem;
        margin-left: 10px;
        padding-left: 10px;
    }

}
</style>

<body>

<div class="brand-wrap">
    <a class="brand" href="/">tripura<span class="io">.io</span></a>
</div>

<div class="container">
    <header>
        <h1>Monier-Williams</h1>
        <div class="ornament" aria-hidden="true">
            <span class="rule"></span><span class="gem"></span><span class="rule"></span>
        </div>
        <p class="subtitle">Sanskrit · English Dictionary</p>
    </header>

    <div class="panel main-panel">
        <div class="editor-header">
            <span class="editor-title">Search · Headwords &amp; Definitions</span>
            <button class="icon-btn" id="pasteBtn" title="Paste from clipboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                </svg>
            </button>
        </div>
        <input id="searchInput" lang="sa-Latn" spellcheck="false" autocomplete="off"
               placeholder="Search the lexicon - e.g. dharma, kfzRa, योग…">

        <div class="bottom-bar">
            <span class="char-count" id="statusText">Loading lexicon…</span>
            <button class="clear-btn" id="clearBtn">Clear</button>
        </div>
    </div>

    <div class="panel results-panel">
        <div id="resultsInner"></div>
    </div>
</div>

<div class="toast" id="toast">Copied to clipboard</div>

<script>
<!--# include virtual="/includes/transliteration-engine.js" -->


/* ================= HELPERS ================= */

function stripAccents(k) { return String(k == null ? '' : k).replace(/[\/\\]/g, ''); }
function cleanKey(k) { return slpToIast(stripAccents(k)); }
function norm(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
}
function escapeRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
// Checks if a string contains Devanagari characters (uses regex on the whole string)
function hasDevanagari(s) { return /[\u0900-\u097F]/.test(s); }
function collapseSpaces(s) { return String(s).replace(/\s{2,}/g, ' '); }

/* ================= STATE & ELEMENTS ================= */

var dict = [];
var ready = false;
var matches = [];
var defMatches = [];
var defPats = [];
var shown = 50;
var MATCH_CAP = 800;
var DEF_CAP = 25;
var EXAMPLES = ['yoga', 'dharma', 'deva', 'upādhi', 'arjuna', 'śruti', 'kṛtvā', 'prakṛti', 'karuṇa', 'pramāṇa'];

var searchInput  = document.getElementById('searchInput');
var resultsInner = document.getElementById('resultsInner');
var statusText   = document.getElementById('statusText');
var clearBtn     = document.getElementById('clearBtn');
var pasteBtn     = document.getElementById('pasteBtn');
var toast        = document.getElementById('toast');

var COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';

function loaderHTML(title, sub) {
    return '<div class="state loading"><div class="gem-big"></div><h2>' + escapeHtml(title) + '</h2><p>' + sub + '</p></div>';
}

function showFatal(err) {
    var msg = (err && err.message) ? err.message : String(err);
    resultsInner.innerHTML =
        '<div class="state error"><div class="gem-big"></div><h2>The lexicon could not be opened</h2>' +
        '<p>' + escapeHtml(msg) + '</p>' +
        '<p style="margin-top:14px">Make sure <code>dictionary.json</code> sits beside this file and that the folder is served locally, e.g. <code>python -m http.server 8000</code> → <code>http://localhost:8000</code>. Opening the page directly via <code>file://</code> blocks the data load.</p></div>';
    statusText.textContent = 'Error — see message above';
}

window.addEventListener('error', function (ev) {
    if (!ready) showFatal(ev.error || ev.message);
});

/* ================= LOAD & INDEX ================= */

resultsInner.innerHTML = loaderHTML('Retrieving the lexicon…', 'Unrolling the Monier-Williams manuscript — a 50 MB file may take a few seconds.');
statusText.textContent = 'Loading lexicon…';

fetch('dictionary.json')
    .then(function (r) { if (!r.ok) throw new Error('dictionary.json returned HTTP ' + r.status); return r.json(); })
    .then(function (data) {
        dict = data;
        resultsInner.innerHTML = loaderHTML('Indexing the lexicon…', 'Preparing ' + dict.length.toLocaleString() + ' entries for search.');
        setTimeout(startIndex, 60);
    })
    .catch(showFatal);

function startIndex() {
    try {
        for (var i = 0; i < dict.length; i++) {
            var e = dict[i];
            var src = stripAccents(e.key1 || e.key2 || '');
            try { e._n = norm(slpToIast(src)); }
            catch (inner) { e._n = norm(src); }

            /* Structural sub-sense detection: an entry continues the
               previous headword block when it shares the same key and
               carries no homonym number of its own. */
            var prev = i > 0 ? dict[i - 1] : null;
            e._cont = !!(prev && !e.hom && prev.key1 && e.key1 === prev.key1);
        }
        ready = true;
        statusText.textContent = dict.length.toLocaleString() + ' entries loaded';
        renderEmpty();
        searchInput.focus();
    } catch (err) {
        showFatal(err);
    }
}

/* ================= SEARCH ================= */

function runSearch() {
    if (!ready) return;
    try {
        var raw = searchInput.value.trim();
        shown = 50;
        defMatches = [];
        defPats = [];

        if (!raw) { renderEmpty(); updateStatus(0); return; }

        // Uses devanagariToIAST() provided by your shared include file!
        var qIast = hasDevanagari(raw) ? devanagariToIAST(raw) : raw;
        var q1 = norm(qIast);
        var q2 = norm(slpToIast(qIast));

        if (!q1 && !q2) { renderNoMatch(raw); updateStatus(0); return; }

        var starts = [], subs = [];
        for (var i = 0; i < dict.length; i++) {
            if (starts.length + subs.length >= MATCH_CAP) break;
            var n = dict[i]._n;
            if (!n) continue;
            if ((q1 && n.indexOf(q1) === 0) || (q2 && n.indexOf(q2) === 0)) starts.push(i);
            else if ((q1 && n.indexOf(q1) > -1) || (q2 && n.indexOf(q2) > -1)) subs.push(i);
        }
        matches = starts.concat(subs);

        if (matches.length <= 10 && q1.length >= 3) {
            defPats = [];
            if (qIast) defPats.push(qIast);
            var slpForm = iastToSlp(qIast);
            if (slpForm && defPats.indexOf(slpForm) === -1) defPats.push(slpForm);
            try { defMatches = scanDefinitions(defPats); } catch (e2) { defMatches = []; }
        }

        if (!matches.length && !defMatches.length) { renderNoMatch(raw); updateStatus(0); return; }
        renderResults();
        updateStatus(matches.length + defMatches.length);
    } catch (err) {
        showFatal(err);
    }
}

function scanDefinitions(pats) {
    var parts = [];
    for (var i = 0; i < pats.length; i++) {
        var p = String(pats[i] || '').trim();
        if (p && parts.indexOf(p) === -1) parts.push(p);
    }
    if (!parts.length) return [];
    var re = new RegExp(parts.map(escapeRe).join('|'), 'i');
    var res = [];
    for (var j = 0; j < dict.length && res.length < DEF_CAP; j++) {
        var b = dict[j].body;
        if (b && re.test(b)) res.push(j);
    }
    return res;
}

function updateStatus(total) {
    var base = dict.length ? dict.length.toLocaleString() + ' entries' : '';
    if (!searchInput.value.trim()) { statusText.textContent = base + ' · begin typing to search'; return; }
    statusText.textContent = base + (total ? ' · ' + total + ' match' + (total === 1 ? '' : 'es') : ' · no matches');
}

/* ================= RENDERING ================= */

function renderEmpty() {
    var chips = '';
    for (var i = 0; i < EXAMPLES.length; i++) {
        chips += '<button class="chip" data-q="' + escapeHtml(EXAMPLES[i]) + '">' + escapeHtml(EXAMPLES[i]) + '</button>';
    }
    resultsInner.innerHTML =
        '<div class="state"><div class="gem-big"></div><h2>The lexicon awaits</h2>' +
        '<p>Search headwords in IAST (<em>yoga</em>), in the Cologne SLP1 key (<em>kfzRa</em>) or in Devanāgarī (<em>योग</em>). ' +
        'When few headwords match, definitions are searched as well.</p>' +
        '<div class="chips">' + chips + '</div></div>';

    var chipEls = resultsInner.querySelectorAll('.chip');
    for (var c = 0; c < chipEls.length; c++) {
        chipEls[c].addEventListener('click', function () {
            searchInput.value = this.getAttribute('data-q');
            runSearch();
            searchInput.focus();
        });
    }
}

function renderNoMatch(q) {
    resultsInner.innerHTML =
        '<div class="state"><div class="gem-big"></div><h2>No entries found</h2>' +
        '<p>Nothing answers to “' + escapeHtml(q) + '”. Try a shorter stem — for instance <em>dev</em> instead of <em>devatā</em>.</p></div>';
}

function sectionLabel(text) {
    var d = document.createElement('div');
    d.className = 'section-label';
    d.textContent = text;
    return d;
}

function renderResults() {
    resultsInner.innerHTML = '';

    if (matches.length) {
        resultsInner.appendChild(sectionLabel('Headword matches · ' + matches.length + (matches.length >= MATCH_CAP ? '+' : '')));
        var end = Math.min(shown, matches.length);
        for (var i = 0; i < end; i++) resultsInner.appendChild(buildEntry(matches[i], null));
        if (shown < matches.length) {
            var wrap = document.createElement('div');
            wrap.className = 'load-more-wrap';
            var btn = document.createElement('button');
            btn.className = 'clear-btn';
            btn.id = 'loadMoreButton';
            btn.textContent = 'Reveal more · ' + (matches.length - shown) + ' remaining';
            wrap.appendChild(btn);
            resultsInner.appendChild(wrap);
        }
    }

    if (defMatches.length) {
        resultsInner.appendChild(sectionLabel('Mentions in definitions · ' + defMatches.length));
        for (var d = 0; d < defMatches.length; d++) resultsInner.appendChild(buildEntry(defMatches[d], defPats));
    }
}

function buildEntry(idx, hlPats) {
    var e = dict[idx];
    var art = document.createElement('article');
    art.className = e._cont ? 'entry cont' : 'entry';

    var head = document.createElement('div');
    head.className = 'entry-head';

    // 1. Get the clean IAST text
    var hwIastText = cleanKey(e.key2 || e.key1);

    // 2. Create the main IAST headword
    var hw = document.createElement('span');
    hw.className = 'hw';
    hw.textContent = hwIastText;
    head.appendChild(hw);

    // 3. Create the Devanagari headword and append it
    if (hwIastText) {
        var hwDev = document.createElement('span');
        hwDev.className = 'hw-dev';
        hwDev.textContent = iastToDevanagari(hwIastText);
        head.appendChild(hwDev);
    }


    var sp = document.createElement('span');
    sp.className = 'spacer';
    head.appendChild(sp);

    if (e.pc) {
        var pc = document.createElement('span');
        pc.className = 'pc-tag';
        pc.textContent = 'p. ' + e.pc;
        head.appendChild(pc);
    }

    var cp = document.createElement('button');
    cp.className = 'icon-btn copy-entry';
    cp.title = 'Copy entry';
    cp.innerHTML = COPY_SVG;
    head.appendChild(cp);

    var body = document.createElement('div');
    body.className = 'entry-body';
    try {
        body.innerHTML = repairBody(e.body);
        convertBody(body);
        if (!startsWithHeadword(body)) {
            var mk = document.createElement('span');
            mk.className = 'sense-mark';
            mk.textContent = '¦';
            body.insertBefore(mk, body.firstChild);
        }
        if (hlPats && hlPats.length) highlightText(body, hlPats);
    } catch (err) {
        body.textContent = collapseSpaces(String(e.body || '').replace(/<[^>]*>/g, ' '));
    }

    art.appendChild(head);
    art.appendChild(body);
    return art;
}

/* True when the entry opens with its own headword (or a homonym numeral),
   false for continuation senses — those receive the MW "¦" divider. */
function startsWithHeadword(bodyEl) {
    var n = bodyEl.firstChild;
    while (n && n.nodeType === 3 && !n.nodeValue.trim()) n = n.nextSibling;
    if (!n || n.nodeType !== 1) return false;
    var cls = n.getAttribute('class') || '';
    return /(^|\s)(s|s1|hom)(\s|$)/.test(cls);
}

function convertBody(bodyEl) {
    var skrts = bodyEl.querySelectorAll('span.s');
    for (var i = 0; i < skrts.length; i++) {
        (function (sp) {
            walkTextNodes(sp, function (t) { return slpToIast(stripAccents(t)); });
        })(skrts[i]);
    }
}

function walkTextNodes(el, fn) {
    var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    var nodes = [], n;
    while ((n = w.nextNode())) nodes.push(n);
    for (var i = 0; i < nodes.length; i++) {
        try { nodes[i].nodeValue = fn(nodes[i].nodeValue); } catch (e) { /* leave node untouched */ }
    }
}

function highlightText(el, pats) {
    var parts = [];
    for (var i = 0; i < pats.length; i++) {
        var p = String(pats[i] || '').trim();
        if (p && parts.indexOf(p) === -1) parts.push(p);
    }
    if (!parts.length) return;
    var re = new RegExp(parts.map(escapeRe).join('|'), 'gi');

    var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    var nodes = [], n;
    while ((n = w.nextNode())) nodes.push(n);

    for (var k = 0; k < nodes.length; k++) {
        var nd = nodes[k];
        var txt = nd.nodeValue;
        re.lastIndex = 0;
        if (!re.test(txt)) continue;
        re.lastIndex = 0;
        var frag = document.createDocumentFragment();
        var last = 0, m;
        while ((m = re.exec(txt)) !== null) {
            if (m[0].length === 0) { re.lastIndex++; continue; }
            if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
            var mk = document.createElement('mark');
            mk.textContent = m[0];
            frag.appendChild(mk);
            last = m.index + m[0].length;
        }
        if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
        nd.parentNode.replaceChild(frag, nd);
    }
}

/* ================= UI WIRING ================= */

var debounceTimer = null;
searchInput.addEventListener('input', function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSearch, 220);
});
searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { clearTimeout(debounceTimer); runSearch(); }
    if (e.key === 'Escape') { searchInput.value = ''; runSearch(); }
});

clearBtn.addEventListener('click', function () {
    searchInput.value = '';
    runSearch();
    searchInput.focus();
});

pasteBtn.addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText()
            .then(function (text) { searchInput.value = String(text).trim(); runSearch(); })
            .catch(function () { showToast('Clipboard access denied'); });
    } else {
        showToast('Clipboard unavailable');
    }
});

document.querySelector('.results-panel').addEventListener('click', function (e) {
    var lm = e.target.closest ? e.target.closest('#loadMoreButton') : null;
    if (lm) { shown += 50; renderResults(); return; }

    var btn = e.target.closest ? e.target.closest('.copy-entry') : null;
    if (!btn) return;
    var art = btn.closest('.entry');
    if (!art) return;
    var hwEl = art.querySelector('.hw');
    var bodyEl = art.querySelector('.entry-body');
    var text = (hwEl ? hwEl.textContent : '') + ' — ' + (bodyEl ? collapseSpaces(bodyEl.innerText.replace(/\s+/g, ' ').trim()) : '');
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
            .then(function () { showToast('Entry copied to clipboard'); })
            .catch(function () { showToast('Copy failed'); });
    } else {
        showToast('Clipboard unavailable');
    }
});

function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove('show'); }, 2000);
}
</script>
</body>
</html>
