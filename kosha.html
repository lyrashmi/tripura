<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monier-Williams · Sanskrit-English Dictionary</title>

<!-- Inject all preloads and stylesheets here -->
<!--# include virtual="/includes/head-assets.html" -->

<!-- Night mode (must stay here to prevent white flash) -->
<!--# include virtual="/includes/night-mode.html" -->

<!--# include virtual="/includes/night-mode.html" -->

</head>
<body class="page-dict">

<!--# include virtual="/includes/brand.html" -->

<div class="container">
    <header>
        <h1>Monier-Williams</h1>
        <div class="ornament" aria-hidden="true">
            <span class="rule"></span><span class="gem"></span><span class="rule"></span>
        </div>
        <p class="subtitle">Sanskrit · English Dictionary</p>
    </header>

    <div class="panel main-panel">
        <div class="editor-header">
            <span class="editor-title">Search · Headwords &amp; Definitions</span>
            <button class="icon-btn" id="pasteBtn" title="Paste from clipboard">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/>
                    <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                </svg>
            </button>
        </div>
        <input id="searchInput" lang="sa-Latn" spellcheck="false" autocomplete="off"
               placeholder="Search the lexicon - e.g. dharma, kfzRa, योग…">

        <div class="bottom-bar">
            <span class="char-count" id="statusText">Loading lexicon…</span>
            <button class="clear-btn" id="clearBtn">Clear</button>
        </div>
    </div>

    <div class="panel results-panel">
        <div id="resultsInner"></div>
    </div>

<!--# set var="footer_text" value="tripura.io" -->
<!--# include virtual="/includes/footer.html" -->
</div>

<script>
<!--# include virtual="/static/transliteration-engine.js" -->


/* ================= HELPERS ================= */

function stripAccents(k) { return String(k == null ? '' : k).replace(/[\/\\]/g, ''); }
function cleanKey(k) { return slpToIast(stripAccents(k)); }
function norm(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
}
function escapeRe(s) { return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
// Checks if a string contains Devanagari characters (uses regex on the whole string)
function hasDevanagari(s) { return /[\u0900-\u097F]/.test(s); }
function collapseSpaces(s) { return String(s).replace(/\s{2,}/g, ' '); }

/* ================= STATE & ELEMENTS ================= */

var dict = [];
var ready = false;
var matches = [];
var defMatches = [];
var defPats = [];
var shown = 50;
var MATCH_CAP = 800;
var DEF_CAP = 25;
var EXAMPLES = ['yoga', 'dharma', 'deva', 'upādhi', 'arjuna', 'śruti', 'kṛtvā', 'prakṛti', 'karuṇa', 'pramāṇa'];

var searchInput  = document.getElementById('searchInput');
var resultsInner = document.getElementById('resultsInner');
var statusText   = document.getElementById('statusText');
var clearBtn     = document.getElementById('clearBtn');
var pasteBtn     = document.getElementById('pasteBtn');
var toast        = document.getElementById('toast');

var COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>';

function loaderHTML(title, sub) {
    return '<div class="state loading"><div class="gem-big"></div><h2>' + escapeHtml(title) + '</h2><p>' + sub + '</p></div>';
}

function showFatal(err) {
    var msg = (err && err.message) ? err.message : String(err);
    resultsInner.innerHTML =
        '<div class="state error"><div class="gem-big"></div><h2>The lexicon could not be opened</h2>' +
        '<p>' + escapeHtml(msg) + '</p>' +
        '<p style="margin-top:14px">Make sure <code>dictionary.json</code> sits beside this file and that the folder is served locally, e.g. <code>python -m http.server 8000</code> → <code>http://localhost:8000</code>. Opening the page directly via <code>file://</code> blocks the data load.</p></div>';
    statusText.textContent = 'Error — see message above';
}

window.addEventListener('error', function (ev) {
    if (!ready) showFatal(ev.error || ev.message);
});

/* ================= LOAD & INDEX ================= */

resultsInner.innerHTML = loaderHTML('Retrieving the lexicon…', 'Unrolling the Monier-Williams manuscript — a 50 MB file may take a few seconds.');
statusText.textContent = 'Loading lexicon…';

fetch('dictionary.json')
    .then(function (r) { if (!r.ok) throw new Error('dictionary.json returned HTTP ' + r.status); return r.json(); })
    .then(function (data) {
        dict = data;
        resultsInner.innerHTML = loaderHTML('Indexing the lexicon…', 'Preparing ' + dict.length.toLocaleString() + ' entries for search.');
        setTimeout(startIndex, 60);
    })
    .catch(showFatal);

function startIndex() {
    try {
        for (var i = 0; i < dict.length; i++) {
            var e = dict[i];
            var src = stripAccents(e.key1 || e.key2 || '');
            try { e._n = norm(slpToIast(src)); }
            catch (inner) { e._n = norm(src); }

            /* Structural sub-sense detection: an entry continues the
               previous headword block when it shares the same key and
               carries no homonym number of its own. */
            var prev = i > 0 ? dict[i - 1] : null;
            e._cont = !!(prev && !e.hom && prev.key1 && e.key1 === prev.key1);
        }
        ready = true;
        statusText.textContent = dict.length.toLocaleString() + ' entries loaded';
        renderEmpty();
        searchInput.focus();
    } catch (err) {
        showFatal(err);
    }
}

/* ================= SEARCH ================= */

function runSearch() {
    if (!ready) return;
    try {
        var raw = searchInput.value.trim();
        shown = 50;
        defMatches = [];
        defPats = [];

        if (!raw) { renderEmpty(); updateStatus(0); return; }

        // Uses devanagariToIAST() provided by your shared include file!
        var qIast = hasDevanagari(raw) ? devanagariToIAST(raw) : raw;
        var q1 = norm(qIast);
        var q2 = norm(slpToIast(qIast));

        if (!q1 && !q2) { renderNoMatch(raw); updateStatus(0); return; }

        var starts = [], subs = [];
        for (var i = 0; i < dict.length; i++) {
            if (starts.length + subs.length >= MATCH_CAP) break;
            var n = dict[i]._n;
            if (!n) continue;
            if ((q1 && n.indexOf(q1) === 0) || (q2 && n.indexOf(q2) === 0)) starts.push(i);
            else if ((q1 && n.indexOf(q1) > -1) || (q2 && n.indexOf(q2) > -1)) subs.push(i);
        }
        matches = starts.concat(subs);

        if (matches.length <= 10 && q1.length >= 3) {
            defPats = [];
            if (qIast) defPats.push(qIast);
            var slpForm = iastToSlp(qIast);
            if (slpForm && defPats.indexOf(slpForm) === -1) defPats.push(slpForm);
            try { defMatches = scanDefinitions(defPats); } catch (e2) { defMatches = []; }
        }

        if (!matches.length && !defMatches.length) { renderNoMatch(raw); updateStatus(0); return; }
        renderResults();
        updateStatus(matches.length + defMatches.length);
    } catch (err) {
        showFatal(err);
    }
}

function scanDefinitions(pats) {
    var parts = [];
    for (var i = 0; i < pats.length; i++) {
        var p = String(pats[i] || '').trim();
        if (p && parts.indexOf(p) === -1) parts.push(p);
    }
    if (!parts.length) return [];
    var re = new RegExp(parts.map(escapeRe).join('|'), 'i');
    var res = [];
    for (var j = 0; j < dict.length && res.length < DEF_CAP; j++) {
        var b = dict[j].body;
        if (b && re.test(b)) res.push(j);
    }
    return res;
}

function updateStatus(total) {
    var base = dict.length ? dict.length.toLocaleString() + ' entries' : '';
    if (!searchInput.value.trim()) { statusText.textContent = base + ' · begin typing to search'; return; }
    statusText.textContent = base + (total ? ' · ' + total + ' match' + (total === 1 ? '' : 'es') : ' · no matches');
}

/* ================= RENDERING ================= */

function renderEmpty() {
    var chips = '';
    for (var i = 0; i < EXAMPLES.length; i++) {
        chips += '<button class="chip" data-q="' + escapeHtml(EXAMPLES[i]) + '">' + escapeHtml(EXAMPLES[i]) + '</button>';
    }
    resultsInner.innerHTML =
        '<div class="state"><div class="gem-big"></div><h2>The lexicon awaits</h2>' +
        '<p>Search headwords in IAST (<em>yoga</em>), in the Cologne SLP1 key (<em>kfzRa</em>) or in Devanāgarī (<em>योग</em>). ' +
        'When few headwords match, definitions are searched as well.</p>' +
        '<div class="chips">' + chips + '</div></div>';

    var chipEls = resultsInner.querySelectorAll('.chip');
    for (var c = 0; c < chipEls.length; c++) {
        chipEls[c].addEventListener('click', function () {
            searchInput.value = this.getAttribute('data-q');
            runSearch();
            searchInput.focus();
        });
    }
}

function renderNoMatch(q) {
    resultsInner.innerHTML =
        '<div class="state"><div class="gem-big"></div><h2>No entries found</h2>' +
        '<p>Nothing answers to “' + escapeHtml(q) + '”. Try a shorter stem — for instance <em>dev</em> instead of <em>devatā</em>.</p></div>';
}

function sectionLabel(text) {
    var d = document.createElement('div');
    d.className = 'section-label';
    d.textContent = text;
    return d;
}

function renderResults() {
    resultsInner.innerHTML = '';

    if (matches.length) {
        resultsInner.appendChild(sectionLabel('Headword matches · ' + matches.length + (matches.length >= MATCH_CAP ? '+' : '')));
        var end = Math.min(shown, matches.length);
        for (var i = 0; i < end; i++) resultsInner.appendChild(buildEntry(matches[i], null));
        if (shown < matches.length) {
            var wrap = document.createElement('div');
            wrap.className = 'load-more-wrap';
            var btn = document.createElement('button');
            btn.className = 'clear-btn';
            btn.id = 'loadMoreButton';
            btn.textContent = 'Reveal more · ' + (matches.length - shown) + ' remaining';
            wrap.appendChild(btn);
            resultsInner.appendChild(wrap);
        }
    }

    if (defMatches.length) {
        resultsInner.appendChild(sectionLabel('Mentions in definitions · ' + defMatches.length));
        for (var d = 0; d < defMatches.length; d++) resultsInner.appendChild(buildEntry(defMatches[d], defPats));
    }
}

function buildEntry(idx, hlPats) {
    var e = dict[idx];
    var art = document.createElement('article');
    art.className = e._cont ? 'entry cont' : 'entry';

    var head = document.createElement('div');
    head.className = 'entry-head';

    // 1. Get the clean IAST text
    var hwIastText = cleanKey(e.key2 || e.key1);

    // 2. Create the main IAST headword
    var hw = document.createElement('span');
    hw.className = 'hw';
    hw.textContent = hwIastText;
    head.appendChild(hw);

    // 3. Create the Devanagari headword and append it
    if (hwIastText) {
        var hwDev = document.createElement('span');
        hwDev.className = 'hw-dev';
        hwDev.textContent = iastToDevanagari(hwIastText);
        head.appendChild(hwDev);
    }


    var sp = document.createElement('span');
    sp.className = 'spacer';
    head.appendChild(sp);

    if (e.pc) {
        var pc = document.createElement('span');
        pc.className = 'pc-tag';
        pc.textContent = 'p. ' + e.pc;
        head.appendChild(pc);
    }

    var cp = document.createElement('button');
    cp.className = 'icon-btn copy-entry';
    cp.title = 'Copy entry';
    cp.innerHTML = COPY_SVG;
    head.appendChild(cp);

    var body = document.createElement('div');
    body.className = 'entry-body';
    try {
        body.innerHTML = repairBody(e.body);
        convertBody(body);
        if (!startsWithHeadword(body)) {
            var mk = document.createElement('span');
            mk.className = 'sense-mark';
            mk.textContent = '¦';
            body.insertBefore(mk, body.firstChild);
        }
        if (hlPats && hlPats.length) highlightText(body, hlPats);
    } catch (err) {
        body.textContent = collapseSpaces(String(e.body || '').replace(/<[^>]*>/g, ' '));
    }

    art.appendChild(head);
    art.appendChild(body);
    return art;
}

/* True when the entry opens with its own headword (or a homonym numeral),
   false for continuation senses — those receive the MW "¦" divider. */
function startsWithHeadword(bodyEl) {
    var n = bodyEl.firstChild;
    while (n && n.nodeType === 3 && !n.nodeValue.trim()) n = n.nextSibling;
    if (!n || n.nodeType !== 1) return false;
    var cls = n.getAttribute('class') || '';
    return /(^|\s)(s|s1|hom)(\s|$)/.test(cls);
}

function convertBody(bodyEl) {
    var skrts = bodyEl.querySelectorAll('span.s');
    for (var i = 0; i < skrts.length; i++) {
        (function (sp) {
            walkTextNodes(sp, function (t) { return slpToIast(stripAccents(t)); });
        })(skrts[i]);
    }
}

function walkTextNodes(el, fn) {
    var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    var nodes = [], n;
    while ((n = w.nextNode())) nodes.push(n);
    for (var i = 0; i < nodes.length; i++) {
        try { nodes[i].nodeValue = fn(nodes[i].nodeValue); } catch (e) { /* leave node untouched */ }
    }
}

function highlightText(el, pats) {
    var parts = [];
    for (var i = 0; i < pats.length; i++) {
        var p = String(pats[i] || '').trim();
        if (p && parts.indexOf(p) === -1) parts.push(p);
    }
    if (!parts.length) return;
    var re = new RegExp(parts.map(escapeRe).join('|'), 'gi');

    var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
    var nodes = [], n;
    while ((n = w.nextNode())) nodes.push(n);

    for (var k = 0; k < nodes.length; k++) {
        var nd = nodes[k];
        var txt = nd.nodeValue;
        re.lastIndex = 0;
        if (!re.test(txt)) continue;
        re.lastIndex = 0;
        var frag = document.createDocumentFragment();
        var last = 0, m;
        while ((m = re.exec(txt)) !== null) {
            if (m[0].length === 0) { re.lastIndex++; continue; }
            if (m.index > last) frag.appendChild(document.createTextNode(txt.slice(last, m.index)));
            var mk = document.createElement('mark');
            mk.textContent = m[0];
            frag.appendChild(mk);
            last = m.index + m[0].length;
        }
        if (last < txt.length) frag.appendChild(document.createTextNode(txt.slice(last)));
        nd.parentNode.replaceChild(frag, nd);
    }
}

/* ================= UI WIRING ================= */

var debounceTimer = null;
searchInput.addEventListener('input', function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(runSearch, 220);
});
searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { clearTimeout(debounceTimer); runSearch(); }
    if (e.key === 'Escape') { searchInput.value = ''; runSearch(); }
});

clearBtn.addEventListener('click', function () {
    searchInput.value = '';
    runSearch();
    searchInput.focus();
});

pasteBtn.addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText()
            .then(function (text) { searchInput.value = String(text).trim(); runSearch(); })
            .catch(function () { showToast('Clipboard access denied'); });
    } else {
        showToast('Clipboard unavailable');
    }
});

document.querySelector('.results-panel').addEventListener('click', function (e) {
    var lm = e.target.closest ? e.target.closest('#loadMoreButton') : null;
    if (lm) { shown += 50; renderResults(); return; }

    var btn = e.target.closest ? e.target.closest('.copy-entry') : null;
    if (!btn) return;
    var art = btn.closest('.entry');
    if (!art) return;
    var hwEl = art.querySelector('.hw');
    var bodyEl = art.querySelector('.entry-body');
    var text = (hwEl ? hwEl.textContent : '') + ' — ' + (bodyEl ? collapseSpaces(bodyEl.innerText.replace(/\s+/g, ' ').trim()) : '');
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
            .then(function () { showToast('Entry copied to clipboard'); })
            .catch(function () { showToast('Copy failed'); });
    } else {
        showToast('Clipboard unavailable');
    }
});

function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () { toast.classList.remove('show'); }, 2000);
}
</script>
</body>
</html>
