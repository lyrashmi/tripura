name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Netcup VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e  # ⚠️ This line forces the Action to turn RED if Git fails
            
            cd /var/www/tripura
            git config core.filemode false
            
            echo "Fetching latest code from GitHub..."
            git fetch origin
            
            echo "Forcing server to match GitHub main branch..."
            git reset --hard origin/main
            
            chown -R www-data:www-data /var/www/tripura
            chmod -R 755 /var/www/tripura
            
            echo "✅ Deployment actually finished successfully!"
