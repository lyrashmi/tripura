          script: |
            cd /var/www/tripura
            
            # 1. Tell Git to ignore permission changes (prevents the block)
            git config core.filemode false
            
            # 2. Fetch and FORCE the server to match GitHub exactly
            git fetch origin
            git reset --hard origin/main  # ⚠️ Change 'main' to 'master' if your branch is master
            
            # 3. Re-apply the permissions for Nginx
            chown -R www-data:www-data /var/www/tripura
            chmod -R 755 /var/www/tripura
            
            echo "Deployment actually successful!"
