<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devanāgarī ↔ IAST — Sanskrit Transliteration Tool</title>

<!-- Night mode (must stay here to prevent white flash) -->
<!--# include virtual="/includes/night-mode.html" -->
<!--# include virtual="/includes/head-assets.html" -->
<link rel="stylesheet" href="/static/styles.css">

</head>

<body>

<!--# include virtual="/includes/brand.html" -->

<div class="container">
    <header>
        <h1>Devanāgarī ↔ IAST</h1>
        <div class="ornament" aria-hidden="true">
            <span class="rule"></span><span class="gem"></span><span class="rule"></span>
        </div>
        <p class="subtitle">Sanskrit Transliteration Tool</p>
    </header>

    <div class="panel main-panel">
        <div class="direction-bar">
            <span class="direction-label active" id="labelFrom">Devanāgarī</span>
            <button class="swap-btn" id="swapBtn" title="Swap direction" aria-label="Swap direction">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 16l-4-4 4-4"/><path d="M17 8l4 4-4 4"/><path d="M3 12h18"/>
                </svg>
            </button>
            <span class="direction-label" id="labelTo">IAST</span>
        </div>

        <div class="editor-grid">
            <div class="editor-col">
                <div class="editor-header">
                    <span class="editor-title" id="fromTitle">Input · Devanāgarī</span>
                    <button class="icon-btn" id="pasteBtn" title="Paste from clipboard">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                        </svg>
                    </button>
                </div>
                <textarea id="inputText" class="dev-font" lang="sa" spellcheck="false"
                    placeholder="Type or paste Devanāgarī here…"></textarea>
            </div>
            <div class="editor-col">
                <div class="editor-header">
                    <span class="editor-title" id="toTitle">Output · IAST</span>
                    <button class="icon-btn" id="copyBtn" title="Copy output">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                        </svg>
                    </button>
                </div>
                <textarea id="outputText" class="latin-font" lang="sa-Latn" spellcheck="false" readonly
                    placeholder="Transliteration appears here…"></textarea>
            </div>
        </div>

        <div class="bottom-bar">
            <span class="char-count" id="charCount">0 characters</span>
            <button class="clear-btn" id="clearBtn">Clear</button>
        </div>
    </div>

    <div class="panel ref-panel">
        <div class="ref-header" id="refToggle">
            <span class="ref-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
                </svg>
                Reference Chart
            </span>
            <span class="ref-arrow" id="refArrow">▼</span>
        </div>
        <div class="ref-content" id="refContent">
            <div class="ref-section">
                <div class="ref-section-title">Vowels · Svara</div>
                <div class="ref-grid" id="vowelGrid"></div>
            </div>
            <div class="ref-section">
                <div class="ref-section-title">Consonants · Vyañjana</div>
                <div class="ref-grid" id="consonantGrid"></div>
            </div>
            <div class="ref-section">
                <div class="ref-section-title">Special Signs</div>
                <div class="ref-grid" id="specialGrid"></div>
            </div>
        </div>
    </div>

<!--# set var="footer_text" value="computed locally, nothing leaves your browser" -->
<!--# include virtual="/includes/footer.html" -->
</div>

<div class="toast" id="toast">Copied to clipboard</div>



<script>

    <!--# include virtual="/static/transliteration-engine.js" -->

/* ================= UI LOGIC ================= */

let direction = 'devToIast';

const inputText  = document.getElementById('inputText');
const outputText = document.getElementById('outputText');
const swapBtn    = document.getElementById('swapBtn');
const labelFrom  = document.getElementById('labelFrom');
const labelTo    = document.getElementById('labelTo');
const fromTitle  = document.getElementById('fromTitle');
const toTitle    = document.getElementById('toTitle');
const charCount  = document.getElementById('charCount');
const clearBtn   = document.getElementById('clearBtn');
const copyBtn    = document.getElementById('copyBtn');
const pasteBtn   = document.getElementById('pasteBtn');
const toast      = document.getElementById('toast');
const refToggle  = document.getElementById('refToggle');
const refContent = document.getElementById('refContent');
const refArrow   = document.getElementById('refArrow');

function applyFonts() {
    if (direction === 'devToIast') {
        inputText.className = 'dev-font';   inputText.lang = 'sa';
        outputText.className = 'latin-font'; outputText.lang = 'sa-Latn';
    } else {
        inputText.className = 'latin-font';  inputText.lang = 'sa-Latn';
        outputText.className = 'dev-font';   outputText.lang = 'sa';
    }
}

function transliterate() {
    outputText.value = direction === 'devToIast'
        ? devanagariToIAST(inputText.value)
        : iastToDevanagari(inputText.value);
    charCount.textContent = inputText.value.length + ' character' + (inputText.value.length === 1 ? '' : 's');
}

function swapDirection() {
    direction = direction === 'devToIast' ? 'iastToDev' : 'devToIast';
    const devFirst = direction === 'devToIast';
    labelFrom.textContent = devFirst ? 'Devanāgarī' : 'IAST';
    labelTo.textContent   = devFirst ? 'IAST' : 'Devanāgarī';
    fromTitle.textContent = devFirst ? 'Input · Devanāgarī' : 'Input · IAST';
    toTitle.textContent   = devFirst ? 'Output · IAST' : 'Output · Devanāgarī';
    inputText.placeholder  = devFirst ? 'Type or paste Devanāgarī here…' : 'Type or paste IAST here…';
    outputText.placeholder = devFirst ? 'Transliteration appears here…' : 'Transliteration appears here…';
    labelFrom.classList.toggle('active', true);
    labelTo.classList.toggle('active', false);

    const carried = outputText.value;
    inputText.value = carried;
    applyFonts();
    transliterate();
}

function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 2000);
}

inputText.addEventListener('input', transliterate);
swapBtn.addEventListener('click', swapDirection);

clearBtn.addEventListener('click', () => {
    inputText.value = '';
    outputText.value = '';
    charCount.textContent = '0 characters';
    inputText.focus();
});

copyBtn.addEventListener('click', () => {
    if (!outputText.value) return;
    navigator.clipboard.writeText(outputText.value)
        .then(() => showToast('Copied to clipboard'))
        .catch(() => { outputText.select(); document.execCommand('copy'); showToast('Copied to clipboard'); });
});

pasteBtn.addEventListener('click', () => {
    navigator.clipboard.readText()
        .then(text => { inputText.value = text; transliterate(); })
        .catch(() => showToast('Clipboard access denied'));
});

refToggle.addEventListener('click', () => {
    refContent.classList.toggle('open');
    refArrow.classList.toggle('open');
});

/* ---------- Reference chart ---------- */
const vowelData = [
    ['अ','a'],['आ','ā'],['इ','i'],['ई','ī'],['उ','u'],['ऊ','ū'],
    ['ऋ', 'ṛ'], ['ॠ', 'ṝ'], ['ऌ', 'ḷ'], ['ॡ', 'ḹ'],['ए','e'],['ऐ','ai'],['ओ','o'],['औ','au']
];
const consonantData = [
    ['क','ka'],['ख','kha'],['ग','ga'],['घ','gha'],['ङ','ṅa'],
    ['च','ca'],['छ','cha'],['ज','ja'],['झ','jha'],['ञ','ña'],
    ['ट','ṭa'],['ठ','ṭha'],['ड','ḍa'],['ढ','ḍha'],['ण','ṇa'],
    ['त','ta'],['थ','tha'],['द','da'],['ध','dha'],['न','na'],
    ['प','pa'],['फ','pha'],['ब','ba'],['भ','bha'],['म','ma'],
    ['य','ya'],['र','ra'],['ल','la'],['व','va'],
    ['श','śa'],['ष','ṣa'],['स','sa'],['ह','ha']
];
const specialData = [
    ['ं','anusvara'],['ः','visarga'],['ँ','candrabindu'],['ऽ','’'],['्','virāma'],['।','daṇa'],['॥','double daṇa']
];

function buildRefGrid(id, data) {
    const grid = document.getElementById(id);
    data.forEach(([dev, iast]) => {
        const item = document.createElement('div');
        item.className = 'ref-item';
        item.title = 'Insert into input';
        item.innerHTML = '<span class="ref-devanagari">' + dev + '</span><span class="ref-iast">' + iast + '</span>';
        item.addEventListener('click', () => {
            inputText.value += (direction === 'devToIast' ? dev : iast);
            transliterate();
            inputText.focus();
        });
        grid.appendChild(item);
    });
}
buildRefGrid('vowelGrid', vowelData);
buildRefGrid('consonantGrid', consonantData);
buildRefGrid('specialGrid', specialData);

/* ---------- Init ---------- */
applyFonts();
inputText.value = '';
transliterate();
</script>
</body>
</html>
