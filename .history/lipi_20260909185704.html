<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devanāgarī ↔ IAST — Sanskrit Transliteration Tool</title>

<!-- EB Garamond (Latin) via Fontsource CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-ext-400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-ext-500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-ext-600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/eb-garamond@5.2.7/latin-ext-700.css">
<!-- Devanagari fallback via Fontsource CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-devanagari@5.2.7/index.css">

<style>
/* Shobhika (Devanagari) — open-source SIL OFL font, served via CDN */
@font-face {
    font-family: 'Shobhika';
    src: url('https://huggingface.co/loopdesk-ai/lipika/resolve/main/fonts/shobhika-400.woff2') format('woff2'),
         url('https://ir.tawkit.net/1app/font/IN-Shobhika.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}
@font-face {
    font-family: 'Shobhika';
    src: url('https://huggingface.co/loopdesk-ai/lipika/resolve/main/fonts/shobhika-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --cream-bg: #fbf7ee;
    --cream-deep: #f6efdf;
    --card-bg: #fffdf8;
    --input-bg: #fffefb;
    --output-bg: #fdf9ef;
    --gold-100: #f7ecd2;
    --gold-200: #efdfb4;
    --gold-300: #e3c987;
    --gold-400: #d4af37;
    --gold-500: #c9971f;
    --gold-600: #a87d15;
    --gold-700: #8a6512;
    --gold-800: #6b4e0e;
    --ink: #3b3020;
    --ink-soft: #6d5f45;
    --ink-muted: #9c8d6f;
    --line: rgba(168, 125, 21, 0.22);
    --line-soft: rgba(168, 125, 21, 0.12);
    --line-strong: rgba(168, 125, 21, 0.42);
    --font-latin: 'EB Garamond', 'Georgia', serif;
    --font-dev: 'Shobhika', 'Noto Sans Devanagari', serif;
    --shadow-card: 0 1px 2px rgba(140, 100, 30, 0.05), 0 12px 40px rgba(140, 100, 30, 0.09);
    --shadow-soft: 0 2px 10px rgba(140, 100, 30, 0.08);
}

html { scroll-behavior: smooth; }

body {
    font-family: var(--font-latin);
    background:
        radial-gradient(1100px 520px at 50% -140px, rgba(212, 175, 55, 0.14), transparent 65%),
        radial-gradient(900px 480px at 50% 115%, rgba(201, 151, 31, 0.10), transparent 70%),
        linear-gradient(180deg, #fdfbf5 0%, var(--cream-bg) 45%, var(--cream-deep) 100%);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
}

::selection { background: rgba(212, 175, 55, 0.28); color: var(--gold-800); }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(168, 125, 21, 0.25); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(168, 125, 21, 0.45); }

.container {
    max-width: 1180px;
    margin: 0 auto;
    padding: 56px 24px 64px;
}

/* ---------- Header ---------- */
header { text-align: center; margin-bottom: 44px; animation: rise .6s ease both; }

h1 {
    font-family: var(--font-latin);
    font-size: clamp(2rem, 4.5vw, 2.9rem);
    font-weight: 600;
    letter-spacing: 0.01em;
    background: linear-gradient(120deg, var(--gold-700) 0%, var(--gold-500) 45%, var(--gold-400) 60%, var(--gold-700) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 14px;
}

.ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 14px;
}
.ornament .rule {
    width: 72px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-400));
}
.ornament .rule:last-child {
    background: linear-gradient(90deg, var(--gold-400), transparent);
}
.ornament .gem {
    width: 7px;
    height: 7px;
    transform: rotate(45deg);
    background: linear-gradient(135deg, var(--gold-400), var(--gold-600));
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
}

.subtitle {
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-muted);
}

/* ---------- Panels ---------- */
.panel {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow-card);
    position: relative;
}
.panel::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
}

.main-panel { padding: 34px 34px 26px; margin-bottom: 26px; animation: rise .6s ease .05s both; }
.ref-panel  { padding: 26px 34px; animation: rise .6s ease .12s both; }

/* ---------- Direction bar ---------- */
.direction-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 30px;
}

.direction-label {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 9px 22px;
    border-radius: 999px;
    border: 1px solid var(--line-soft);
    background: transparent;
    transition: all .35s ease;
}
.direction-label.active {
    color: var(--gold-700);
    background: linear-gradient(135deg, #fdf6e3, var(--gold-100));
    border-color: var(--line);
    box-shadow: var(--shadow-soft);
}

.swap-btn {
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    color: #fffdf6;
    background: linear-gradient(135deg, var(--gold-400), var(--gold-600));
    box-shadow: 0 4px 14px rgba(168, 125, 21, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.35);
    transition: transform .45s cubic-bezier(.4, 0, .2, 1), box-shadow .3s ease, filter .3s ease;
}
.swap-btn:hover {
    transform: rotate(180deg) scale(1.06);
    filter: brightness(1.06);
    box-shadow: 0 6px 20px rgba(168, 125, 21, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.35);
}
.swap-btn:active { transform: rotate(180deg) scale(0.97); }
.swap-btn svg { width: 20px; height: 20px; }

/* ---------- Editors ---------- */
.editor-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
}
.editor-col { display: flex; flex-direction: column; gap: 10px; }

.editor-header { display: flex; align-items: center; justify-content: space-between; }

.editor-title {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-muted);
}

.icon-btn {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-muted);
    cursor: pointer;
    transition: all .25s ease;
}
.icon-btn:hover {
    color: var(--gold-600);
    background: var(--gold-100);
    border-color: var(--line-soft);
}
.icon-btn svg { width: 16px; height: 16px; }

textarea {
    width: 100%;
    min-height: 300px;
    padding: 22px 24px;
    border-radius: 14px;
    border: 1px solid var(--line);
    color: var(--ink);
    resize: vertical;
    outline: none;
    transition: border-color .3s ease, box-shadow .3s ease, background .3s ease;
}
textarea#inputText { background: var(--input-bg); }
textarea#outputText { background: var(--output-bg); }

textarea:focus {
    border-color: var(--line-strong);
    box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.14), var(--shadow-soft);
}
textarea::placeholder { color: var(--ink-muted); opacity: .75; font-style: italic; }
textarea[readonly] { cursor: default; }

textarea.latin-font {
    font-family: var(--font-latin);
    font-size: 1.28rem;
    line-height: 1.9;
    letter-spacing: 0.015em;
}
textarea.dev-font {
    font-family: var(--font-dev);
    font-size: 1.34rem;
    line-height: 2.1;
}

/* ---------- Bottom bar ---------- */
.bottom-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line-soft);
}
.char-count { font-size: 0.92rem; color: var(--ink-muted); letter-spacing: 0.04em; }

.clear-btn {
    font-family: var(--font-latin);
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 9px 24px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all .25s ease;
}
.clear-btn:hover {
    background: var(--gold-100);
    border-color: var(--line-strong);
    color: var(--gold-700);
}

/* ---------- Reference ---------- */
.ref-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
}
.ref-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold-600);
}
.ref-title svg { width: 18px; height: 18px; }
.ref-arrow {
    color: var(--ink-muted);
    font-size: 0.8rem;
    transition: transform .35s ease;
}
.ref-arrow.open { transform: rotate(180deg); }

.ref-content { display: none; padding-top: 26px; }
.ref-content.open { display: block; animation: rise .4s ease both; }

.ref-section { margin-bottom: 28px; }
.ref-section:last-child { margin-bottom: 4px; }
.ref-section-title {
    font-size: 0.76rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line-soft);
}

.ref-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 10px;
}
.ref-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 12px 8px 10px;
    border-radius: 12px;
    background: var(--output-bg);
    border: 1px solid var(--line-soft);
    cursor: pointer;
    transition: all .25s ease;
}
.ref-item:hover {
    background: var(--gold-100);
    border-color: var(--line);
    transform: translateY(-2px);
    box-shadow: var(--shadow-soft);
}
.ref-devanagari {
    font-family: var(--font-dev);
    font-size: 1.3rem;
    line-height: 1.5;
    color: var(--gold-700);
}
.ref-iast {
    font-family: var(--font-latin);
    font-size: 0.92rem;
    color: var(--ink-muted);
    letter-spacing: 0.04em;
}

/* ---------- Toast ---------- */
.toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(90px);
    padding: 12px 28px;
    border-radius: 999px;
    background: var(--card-bg);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-card);
    color: var(--gold-700);
    font-size: 0.98rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    opacity: 0;
    transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s ease;
    z-index: 100;
    pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* ---------- Animation ---------- */
@keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ---------- Responsive ---------- */
@media (max-width: 820px) {
    .container { padding: 36px 16px 48px; }
    .main-panel, .ref-panel { padding: 22px 18px; }
    .editor-grid { grid-template-columns: 1fr; }
    textarea { min-height: 200px; }
    .direction-bar { gap: 10px; }
    .direction-label { padding: 8px 14px; font-size: 0.8rem; }
    .ref-grid { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); }
}
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>Devanāgarī ↔ IAST</h1>
        <div class="ornament" aria-hidden="true">
            <span class="rule"></span><span class="gem"></span><span class="rule"></span>
        </div>
        <p class="subtitle">Sanskrit Transliteration Tool</p>
    </header>

    <div class="panel main-panel">
        <div class="direction-bar">
            <span class="direction-label active" id="labelFrom">Devanāgarī</span>
            <button class="swap-btn" id="swapBtn" title="Swap direction" aria-label="Swap direction">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 16l-4-4 4-4"/><path d="M17 8l4 4-4 4"/><path d="M3 12h18"/>
                </svg>
            </button>
            <span class="direction-label" id="labelTo">IAST</span>
        </div>

        <div class="editor-grid">
            <div class="editor-col">
                <div class="editor-header">
                    <span class="editor-title" id="fromTitle">Input · Devanāgarī</span>
                    <button class="icon-btn" id="pasteBtn" title="Paste from clipboard">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/>
                            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                        </svg>
                    </button>
                </div>
                <textarea id="inputText" class="dev-font" lang="sa" spellcheck="false"
                    placeholder="Type or paste Devanāgarī here…"></textarea>
            </div>
            <div class="editor-col">
                <div class="editor-header">
                    <span class="editor-title" id="toTitle">Output · IAST</span>
                    <button class="icon-btn" id="copyBtn" title="Copy output">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                        </svg>
                    </button>
                </div>
                <textarea id="outputText" class="latin-font" lang="sa-Latn" spellcheck="false" readonly
                    placeholder="Transliteration appears here…"></textarea>
            </div>
        </div>

        <div class="bottom-bar">
            <span class="char-count" id="charCount">0 characters</span>
            <button class="clear-btn" id="clearBtn">Clear</button>
        </div>
    </div>

    <div class="panel ref-panel">
        <div class="ref-header" id="refToggle">
            <span class="ref-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
                </svg>
                Reference Chart
            </span>
            <span class="ref-arrow" id="refArrow">▼</span>
        </div>
        <div class="ref-content" id="refContent">
            <div class="ref-section">
                <div class="ref-section-title">Vowels · Svara</div>
                <div class="ref-grid" id="vowelGrid"></div>
            </div>
            <div class="ref-section">
                <div class="ref-section-title">Consonants · Vyañjana</div>
                <div class="ref-grid" id="consonantGrid"></div>
            </div>
            <div class="ref-section">
                <div class="ref-section-title">Special Signs</div>
                <div class="ref-grid" id="specialGrid"></div>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast">Copied to clipboard</div>

<script>
/* ================= TRANSLITERATION ENGINE ================= */

const devToIastMap = {
    'अ':'a','आ':'ā','इ':'i','ई':'ī','उ':'u','ऊ':'ū',
    'ऋ':'ṛ','ॠ':'ṝ','ऌ':'ḷ','ॡ':'ḹ',
    'ए':'e','ऐ':'ai','ओ':'o','औ':'au',
    'ा':'ā','ि':'i','ी':'ī','ु':'u','ू':'ū',
    'ृ':'ṛ','ॄ':'ṝ','ॢ':'ḷ','ॣ':'ḹ',
    'े':'e','ै':'ai','ो':'o','ौ':'au',
    'क':'k','ख':'kh','ग':'g','घ':'gh','ङ':'ṅ',
    'च':'c','छ':'ch','ज':'j','झ':'jh','ञ':'ñ',
    'ट':'ṭ','ठ':'ṭh','ड':'ḍ','ढ':'ḍh','ण':'ṇ',
    'त':'t','थ':'th','द':'d','ध':'dh','न':'n',
    'प':'p','फ':'ph','ब':'b','भ':'bh','म':'m',
    'य':'y','र':'r','ल':'l','व':'v',
    'श':'ś','ष':'ṣ','स':'s','ह':'h',
    'ं':'ṃ','ः':'ḥ','ऽ':"'",'ँ':'m̐',
    '्':'','़':'',
    '०':'0','१':'1','२':'2','३':'3','४':'4','५':'5','६':'6','७':'7','८':'8','९':'9',
    '।':'।','॥':'॥'
};

const conjunctDevToIast = { 'क्ष':'kṣa','त्र':'tra','ज्ञ':'jña','श्र':'śra' };

const iastToDevMap = {
    'a':'अ','ā':'आ','i':'इ','ī':'ई','u':'उ','ū':'ऊ',
    'ṛ':'ऋ','ṝ':'ॠ','ḷ':'ऌ','ḹ':'ॡ','e':'ए','ai':'ऐ','o':'ओ','au':'औ',
    'k':'क','kh':'ख','g':'ग','gh':'घ','ṅ':'ङ',
    'c':'च','ch':'छ','j':'ज','jh':'झ','ñ':'ञ',
    'ṭ':'ट','ṭh':'ठ','ḍ':'ड','ḍh':'ढ','ṇ':'ण',
    't':'त','th':'थ','d':'द','dh':'ध','n':'न',
    'p':'प','ph':'फ','b':'ब','bh':'भ','m':'म',
    'y':'य','r':'र','l':'ल','v':'व',
    'ś':'श','ṣ':'ष','s':'स','h':'ह',
    'ṃ':'ं','ḥ':'ः',"'":'ऽ','m̐':'ँ'
};

const iastVowelMatra = {
    'ā':'ा','i':'ि','ī':'ी','u':'ु','ū':'ू',
    'ṛ':'ृ','ṝ':'ॄ','ḷ':'ॢ','ḹ':'ॣ',
    'e':'े','ai':'ै','o':'ो','au':'ौ'
};

const consonants = new Set(['k','kh','g','gh','ṅ','c','ch','j','jh','ñ','ṭ','ṭh','ḍ','h','ṇ','t','th','d','dh','n','p','ph','b','bh','m','y','r','l','v','ś','ṣ','s','h']);
const vowels = new Set(['a','ā','i','ī','u','ū','ṛ','ṝ','ḷ','ḹ','e','ai','o','au']);

const CONSONANT_SET = 'कखगघङचछजझञटठडढणतथदधनपफबभमयरलवशषसह';
const MATRA_SET = 'ािीुूृॄॢॣेैोौ';
const VOWEL_SET = 'अआइईउऊऋॠऌॡएऐओऔ';

// FIX: Added `ch !== ''` to prevent empty strings from matching in `.includes()`
const isConsonant = ch => ch !== '' && CONSONANT_SET.includes(ch);
const isMatra = ch => ch !== '' && MATRA_SET.includes(ch);
const isIndependentVowel = ch => ch !== '' && VOWEL_SET.includes(ch);
const isDevanagari = ch => { const c = ch.charCodeAt(0); return c >= 0x0900 && c <= 0x097F; };
const getStandaloneVowel = v => iastToDevMap[v] || v;

function devanagariToIAST(input) {
    let result = '';
    let i = 0;
    while (i < input.length) {
        let found = false;
        if (i + 2 < input.length) {
            const three = input.substring(i, i + 3);
            if (conjunctDevToIast[three]) { result += conjunctDevToIast[three]; i += 3; found = true; }
        }
        if (!found) {
            const ch = input[i];
            if (devToIastMap[ch] !== undefined) {
                const mapped = devToIastMap[ch];
                if (isConsonant(ch)) {
                    result += mapped;
                    if (i + 1 < input.length && input[i + 1] === '्') { i += 2; continue; }
                    if (i + 1 < input.length && isMatra(input[i + 1])) { i++; continue; }
                    if (i + 1 < input.length && (input[i + 1] === 'ं' || input[i + 1] === 'ँ' || input[i + 1] === 'ः')) { result += 'a'; i++; continue; }
                    if (i + 1 >= input.length || !isDevanagari(input[i + 1]) || isConsonant(input[i + 1]) || isIndependentVowel(input[i + 1])) { result += 'a'; }
                } else {
                    result += mapped;
                }
            } else { result += ch; }
            i++;
        }
    }
    return result;
}

function iastToDevanagari(input) {
    let result = '';
    let i = 0;
    const passthrough = ch => ' \n\t.,;:!?-()"\'0123456789'.includes(ch);

    const consumeConsonant = (cons, nextI) => {
        result += iastToDevMap[cons];
        if (nextI >= input.length) { result += '्'; return nextI; }
        if (nextI + 1 < input.length) {
            const two = input.substring(nextI, nextI + 2);
            if (vowels.has(two) && two !== 'a') { result += iastVowelMatra[two]; return nextI + 2; }
        }
        const one = input[nextI];
        if (vowels.has(one) && one !== 'a') { result += iastVowelMatra[one]; return nextI + 1; }
        if (one === 'a') { return nextI + 1; }
        result += '्';
        return nextI;
    };

    while (i < input.length) {
        if (passthrough(input[i])) { result += input[i]; i++; continue; }

        let matched = false;
        if (i + 1 < input.length) {
            const two = input.substring(i, i + 2);
            if (iastToDevMap[two]) {
                if (consonants.has(two)) { i = consumeConsonant(two, i + 2); }
                else { result += iastToDevMap[two]; i += 2; }
                matched = true;
            }
        }
        if (!matched) {
            const one = input[i];
            if (iastToDevMap[one] && consonants.has(one)) { i = consumeConsonant(one, i + 1); matched = true; }
            else if (iastToDevMap[one] && !vowels.has(one)) { result += iastToDevMap[one]; i++; matched = true; }
        }
        if (!matched) {
            if (i + 1 < input.length) {
                const two = input.substring(i, i + 2);
                if (vowels.has(two)) {
                    const lastCh = result[result.length - 1] || '';
                    result += isConsonant(lastCh) ? iastVowelMatra[two] : getStandaloneVowel(two);
                    i += 2; matched = true;
                }
            }
            if (!matched) {
                const one = input[i];
                if (vowels.has(one)) {
                    const lastCh = result[result.length - 1] || '';
                    if (one === 'a') { if (!isConsonant(lastCh)) result += 'अ'; }
                    else { result += isConsonant(lastCh) ? iastVowelMatra[one] : getStandaloneVowel(one); }
                    i++;
                } else { result += one; i++; }
            }
        }
    }
    return result;
}

/* ================= UI LOGIC ================= */

let direction = 'devToIast';

const inputText  = document.getElementById('inputText');
const outputText = document.getElementById('outputText');
const swapBtn    = document.getElementById('swapBtn');
const labelFrom  = document.getElementById('labelFrom');
const labelTo    = document.getElementById('labelTo');
const fromTitle  = document.getElementById('fromTitle');
const toTitle    = document.getElementById('toTitle');
const charCount  = document.getElementById('charCount');
const clearBtn   = document.getElementById('clearBtn');
const copyBtn    = document.getElementById('copyBtn');
const pasteBtn   = document.getElementById('pasteBtn');
const toast      = document.getElementById('toast');
const refToggle  = document.getElementById('refToggle');
const refContent = document.getElementById('refContent');
const refArrow   = document.getElementById('refArrow');

function applyFonts() {
    if (direction === 'devToIast') {
        inputText.className = 'dev-font';   inputText.lang = 'sa';
        outputText.className = 'latin-font'; outputText.lang = 'sa-Latn';
    } else {
        inputText.className = 'latin-font';  inputText.lang = 'sa-Latn';
        outputText.className = 'dev-font';   outputText.lang = 'sa';
    }
}

function transliterate() {
    outputText.value = direction === 'devToIast'
        ? devanagariToIAST(inputText.value)
        : iastToDevanagari(inputText.value);
    charCount.textContent = inputText.value.length + ' character' + (inputText.value.length === 1 ? '' : 's');
}

function swapDirection() {
    direction = direction === 'devToIast' ? 'iastToDev' : 'devToIast';
    const devFirst = direction === 'devToIast';
    labelFrom.textContent = devFirst ? 'Devanāgarī' : 'IAST';
    labelTo.textContent   = devFirst ? 'IAST' : 'Devanāgarī';
    fromTitle.textContent = devFirst ? 'Input · Devanāgarī' : 'Input · IAST';
    toTitle.textContent   = devFirst ? 'Output · IAST' : 'Output · Devanāgarī';
    inputText.placeholder  = devFirst ? 'Type or paste Devanāgarī here…' : 'Type or paste IAST here…';
    outputText.placeholder = devFirst ? 'Transliteration appears here…' : 'Transliteration appears here…';
    labelFrom.classList.toggle('active', true);
    labelTo.classList.toggle('active', false);

    const carried = outputText.value;
    inputText.value = carried;
    applyFonts();
    transliterate();
}

function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 2000);
}

inputText.addEventListener('input', transliterate);
swapBtn.addEventListener('click', swapDirection);

clearBtn.addEventListener('click', () => {
    inputText.value = '';
    outputText.value = '';
    charCount.textContent = '0 characters';
    inputText.focus();
});

copyBtn.addEventListener('click', () => {
    if (!outputText.value) return;
    navigator.clipboard.writeText(outputText.value)
        .then(() => showToast('Copied to clipboard'))
        .catch(() => { outputText.select(); document.execCommand('copy'); showToast('Copied to clipboard'); });
});

pasteBtn.addEventListener('click', () => {
    navigator.clipboard.readText()
        .then(text => { inputText.value = text; transliterate(); })
        .catch(() => showToast('Clipboard access denied'));
});

refToggle.addEventListener('click', () => {
    refContent.classList.toggle('open');
    refArrow.classList.toggle('open');
});

/* ---------- Reference chart ---------- */
const vowelData = [
    ['अ','a'],['आ','ā'],['इ','i'],['ई','ī'],['उ','u'],['ऊ','ū'],
    ['ऋ', 'ṛ'], ['ॠ', 'ṝ'], ['ऌ', 'ḷ'], ['ॡ', 'ḹ'],['ए','e'],['ऐ','ai'],['ओ','o'],['औ','au']
];
const consonantData = [
    ['क','ka'],['ख','kha'],['ग','ga'],['घ','gha'],['ङ','ṅa'],
    ['च','ca'],['छ','cha'],['ज','ja'],['झ','jha'],['ञ','ña'],
    ['ट','ṭa'],['ठ','ṭha'],['ड','ḍa'],['ढ','ḍha'],['ण','ṇa'],
    ['त','ta'],['थ','tha'],['द','da'],['ध','dha'],['न','na'],
    ['प','pa'],['फ','pha'],['ब','ba'],['भ','bha'],['म','ma'],
    ['य','ya'],['र','ra'],['ल','la'],['व','va'],
    ['श','śa'],['ष','ṣa'],['स','sa'],['ह','ha']
];
const specialData = [
    ['ं','ṃ'],['ः','visarga'],['ँ','candrabindu'],['ऽ','’'],['्','virāma'],['।','daṇa'],['॥','double daṇa']
];

function buildRefGrid(id, data) {
    const grid = document.getElementById(id);
    data.forEach(([dev, iast]) => {
        const item = document.createElement('div');
        item.className = 'ref-item';
        item.title = 'Insert into input';
        item.innerHTML = '<span class="ref-devanagari">' + dev + '</span><span class="ref-iast">' + iast + '</span>';
        item.addEventListener('click', () => {
            inputText.value += (direction === 'devToIast' ? dev : iast);
            transliterate();
            inputText.focus();
        });
        grid.appendChild(item);
    });
}
buildRefGrid('vowelGrid', vowelData);
buildRefGrid('consonantGrid', consonantData);
buildRefGrid('specialGrid', specialData);

/* ---------- Init ---------- */
applyFonts();
inputText.value = 'नमस्ते संस्कृतम्';
transliterate();
</script>
